packages:
  - "apps/*"

onlyBuiltDependencies:
  - "@nestjs/core"
  - "@prisma/client"
  - "@prisma/engines"
  - "@scarf/scarf"
  - "esbuild"
  - "prisma"
allowBuilds:
  # FIX: Firebase writes its runtime defaults module during postinstall.
  '@firebase/util': true
  "@nestjs/core": true
  "@prisma/client": true
  "@prisma/engines": true
  "@scarf/scarf": true
  esbuild: true
  prisma: true
  # FIX: protobufjs only emits a dependency-version warning; no build output is required.
  protobufjs: false
